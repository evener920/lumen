name = "notion-to-lumen"
main = "worker.js"
compatibility_date = "2025-09-03"

# 非密钥配置（可提交到仓库）
[vars]
GH_OWNER = "evener920"
GH_REPO = "lumen"
GH_BRANCH = "main"
MD_DIR = "md"
NOTION_DATA_SOURCE_ID = "f82feb00-ed72-82fe-93d1-07e0dd0a0435"

# 可选：去重 KV（不绑定也能跑，靠 GitHub 文件内容比对去重）。需要时在 dashboard 建 KV 并填入 id。
# [[kv_namespaces]]
# binding = "KV"
# id = "REPLACE_WITH_YOUR_KV_ID"

# 可选：绑定自定义域名作为 Notion Webhook 地址（否则用 *.workers.dev 默认域名）
# routes = [
#   { pattern = "notion-sync.yourdomain.com", custom_domain = true }
# ]

# 部署前设置密钥（不要写进本文件）：
#   wrangler secret put NOTION_TOKEN      # Notion integration 的 Internal Integration Secret
#   wrangler secret put GITHUB_TOKEN      # 具备 evener920/lumen 仓库 contents:write 的 Fine-grained PAT
#   wrangler secret put NOTION_VERIFICATION_TOKEN   # 可选：Notion webhook 握手后自动存入 KV，可省略
